name: Publish to npm

on:
  push:
    tags:
      - "v*.*.*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to publish (defaults to selected ref)"
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish pi-cursor-embedded-compat
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Validate package
        run: npm run ci

      - name: Check npm version
        id: published
        shell: bash
        run: |
          name=$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).name")
          version=$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")
          status=$(curl -sS -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/${name}/${version}")
          if [ "$status" = "200" ]; then
            echo "${name}@${version} is already published; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "$status" = "404" ]; then
            echo "${name}@${version} is not published; continuing."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "Unexpected npm registry status: $status" >&2
            exit 1
          fi

      - name: Upgrade npm for Trusted Publishing
        if: steps.published.outputs.skip != 'true'
        run: npm install --global npm@latest

      - name: Publish package
        if: steps.published.outputs.skip != 'true'
        run: npm publish --access public
